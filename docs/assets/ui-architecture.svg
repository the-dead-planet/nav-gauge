<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="302" height="442" viewBox="0 0 302 442" role="img" aria-labelledby="title description">
    <title id="title">UI component architecture</title>
    <desc id="description">Arrows lead from design-system through chassis and motion, hud, gizmos, rigs, and forms to assemblies. Colors use the default dark theme.</desc>
    <defs>
        <linearGradient id="primary" x2="0" y2="1" gradientUnits="objectBoundingBox">
            <stop stop-color="#042424"/>
            <stop offset="1" stop-color="#013131"/>
        </linearGradient>
        <linearGradient id="secondary" x2="0" y2="1" gradientUnits="objectBoundingBox">
            <stop stop-color="#271d09"/>
            <stop offset="1" stop-color="#3f2f07"/>
        </linearGradient>
        <linearGradient id="tertiary" x2="0" y2="1" gradientUnits="objectBoundingBox">
            <stop stop-color="#261b26"/>
            <stop offset="1" stop-color="#3c2a3c"/>
        </linearGradient>
        <marker id="primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0e807f"/>
        </marker>
        <marker id="tertiary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#cd91cd"/>
        </marker>
    </defs>
    <g fill="none" stroke="#0e807f" marker-end="url(#primary-arrow)">
        <path d="M 231 397 V 377"/>
        <path d="M 71 397 V 377"/>
        <path d="M 71 337 V 317"/>
        <path d="M 231 337 V 317"/>
        <path d="M 151 257 V 237"/>
        <path d="M 151 193 V 173"/>
        <path d="M 151 129 V 109"/>
    </g>
    <path d="M 151 65 V 45" fill="none" stroke="#cd91cd" marker-end="url(#tertiary-arrow)"/>
    <g fill="url(#primary)" stroke="#0e807f">
        <rect x="1" y="65" width="300" height="44"/>
        <rect x="1" y="129" width="300" height="44"/>
        <rect x="1" y="193" width="300" height="44"/>
        <rect x="1" y="257" width="300" height="60"/>
        <rect x="1" y="337" width="140" height="40"/>
        <rect x="161" y="337" width="140" height="40"/>
    </g>
    <rect x="1" y="1" width="300" height="44" fill="url(#tertiary)" stroke="#cd91cd"/>
    <rect x="1" y="397" width="300" height="44" fill="url(#secondary)" stroke="#dca600"/>
    <g fill="#e0e0e0" font-family="Space Grotesk, Arial, sans-serif" font-size="12" text-anchor="middle">
        <text x="151" y="19" font-weight="bold">assemblies</text>
        <text x="151" y="34" font-size="11">theme-mode-toggle · theme-select</text>
        <text x="151" y="83" font-weight="bold">forms</text>
        <text x="151" y="98" font-size="11">color-input · color-select-field · file-input · …</text>
        <text x="151" y="147" font-weight="bold">rigs</text>
        <text x="151" y="162" font-size="11">popup · dialog · tabstrip · menu</text>
        <text x="151" y="211" font-weight="bold">gizmos</text>
        <text x="151" y="226" font-size="11">button · chip · color-box · resize-handle · tooltip · …</text>
        <text x="151" y="277" font-weight="bold">hud</text>
        <text x="151" y="292" font-size="11">hexagon · panel · bevel-panel · notched-panel</text>
        <text x="151" y="306" font-size="11">decoration · connector</text>
        <text x="71" y="352" font-weight="bold">chassis</text>
        <text x="71" y="367" font-size="11">flex-box · grid · divider</text>
        <text x="231" y="352" font-weight="bold">motion</text>
        <text x="231" y="367" font-size="11">transition</text>
        <text x="151" y="415" font-weight="bold">design-system</text>
