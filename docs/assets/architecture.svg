<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="302" height="467" viewBox="0 0 302 467" role="img" aria-labelledby="title description">
    <title id="title">Application architecture</title>
    <desc id="description">Building blocks lead to consumers: Tinker chest, UI, Apparatus, Gears, and the web and mobile apps. Within UI, Apparatus, and each Gear, common packages provide shared logic and APIs to their web and mobile packages.</desc>
    <defs>
        <linearGradient id="primary" x2="0" y2="1">
            <stop stop-color="#042424"/>
            <stop offset="1" stop-color="#013131"/>
        </linearGradient>
        <linearGradient id="secondary" x2="0" y2="1">
            <stop stop-color="#271d09"/>
            <stop offset="1" stop-color="#3f2f07"/>
        </linearGradient>
        <linearGradient id="tertiary" x2="0" y2="1">
            <stop stop-color="#261b26"/>
            <stop offset="1" stop-color="#3c2a3c"/>
        </linearGradient>
        <linearGradient id="neutral" x2="0" y2="1">
            <stop stop-color="#1e1f1f"/>
            <stop offset="1" stop-color="#292b2b"/>
        </linearGradient>
        <marker id="primary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0e807f"/>
        </marker>
        <marker id="tertiary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#cd91cd"/>
        </marker>
    </defs>
    <g fill="none" stroke="#0e807f" marker-end="url(#primary-arrow)">
        <path d="M 71 65 V 45"/>
        <path d="M 151 145 V 125"/>
        <path d="M 151 209 V 189"/>
        <path d="M 151 273 V 253"/>
        <path d="M 71 399 V 429"/>
    </g>
    <g fill="none" stroke="#cd91cd" marker-end="url(#tertiary-arrow)">
        <path d="M 231 65 V 45"/>
        <path d="M 231 399 V 429"/>
    </g>
    <g fill="url(#primary)" stroke="#0e807f">
        <rect x="1" y="1" width="140" height="44"/>
        <rect x="1" y="145" width="300" height="44"/>
        <rect x="1" y="209" width="300" height="44"/>
        <rect x="1" y="429" width="140" height="36"/>
    </g>
    <g fill="url(#tertiary)" stroke="#cd91cd">
        <rect x="161" y="1" width="140" height="44"/>
        <rect x="161" y="429" width="140" height="36"/>
    </g>
    <g fill="url(#neutral)" stroke="#585c5b">
        <rect x="1" y="65" width="300" height="60"/>
        <rect x="1" y="363" width="300" height="36"/>
    </g>
    <rect x="1" y="273" width="300" height="44" fill="url(#secondary)" stroke="#dca600"/>
    <g fill="#e0e0e0" font-family="Space Grotesk, Arial, sans-serif" font-size="12" text-anchor="middle">
        <text x="71" y="19" font-weight="bold">Web app</text>
        <text x="71" y="34" font-size="11">app-web</text>
        <text x="231" y="19" font-weight="bold">Mobile app</text>
        <text x="231" y="34" font-size="11">app-mobile</text>
        <text x="151" y="85" font-weight="bold">Gears</text>
        <text x="151" y="100" font-size="11">gears/*/{common,web,mobile}</text>
        <text x="151" y="114" font-size="11">Gear 1 · Gear 2 · … · Gear N</text>
        <text x="151" y="163" font-weight="bold">Apparatus</text>
        <text x="151" y="178" font-size="11">apparatus/{common,web,mobile}</text>
        <text x="151" y="227" font-weight="bold">UI</text>
        <text x="151" y="242" font-size="11">ui/{common,web,mobile}</text>
        <text x="151" y="291" font-weight="bold">Tinker chest</text>
        <text x="151" y="306" font-size="11">tinker-chest · platform-neutral utilities</text>
        <text x="151" y="349" font-weight="bold">Platform split within UI, Apparatus, and each Gear</text>
        <text x="151" y="385"><tspan font-weight="bold">Common</tspan> · shared logic / API</text>
        <text x="71" y="451" font-weight="bold">Web</text>
        <text x="231" y="451" font-weight="bold">Mobile</text>
    </g>
</svg>
