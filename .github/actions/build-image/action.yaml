name: Build and publish image
description: Build a container image with a dedicated cache and publish it to GHCR.
inputs:
  dockerfile:
    description: Dockerfile path relative to the repository root.
    required: true
  image:
    description: Fully qualified image name without a tag.
    required: true
  cache-scope:
    description: Build cache scope for this image.
    required: true
  registry-token:
    description: Token used to publish to GHCR.
    required: true
outputs:
  image-reference:
    description: Published image pinned to its digest.
    value: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}

    - name: Determine image version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ inputs.image }}:${{ steps.version.outputs.tag }}
        labels: runnumber=${{ github.run_id }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
