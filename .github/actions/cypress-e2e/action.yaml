name: Cypress E2E
description: Set up cached dependencies and run web E2E tests locally or against a deployed site.
inputs:
  build:
    description: Optional command to build the app before testing.
    required: false
  start:
    description: Optional command to start a local server before testing.
    required: false
  base-url:
    description: URL to wait for and test.
    default: http://localhost:3000
  browser:
    description: Browser used to run Cypress tests.
    default: chrome
  artifact-name:
    description: Name of the uploaded Cypress screenshots artifact.
    default: cypress-screenshots
runs:
  using: composite
  steps:
    - name: Restore Cypress binary cache
      id: cache-cypress
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: cypress-binary-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

    - name: Setup dependencies
      uses: ./.github/actions/setup-yarn

    - name: Install Cypress binary
      if: steps.cache-cypress.outputs.cache-hit != 'true'
      shell: bash
      working-directory: app-web
      run: yarn exec cypress install

    - name: Cypress E2E tests
      uses: cypress-io/github-action@v7
      with:
        working-directory: app-web
        install: false
        build: ${{ inputs.build }}
        start: ${{ inputs.start }}
        wait-on: ${{ inputs.base-url }}
        config: baseUrl=${{ inputs.base-url }}
        browser: ${{ inputs.browser }}

    - name: Upload Cypress screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: app-web/cypress/screenshots/
        retention-days: 7

    - name: Print artifact URL
      if: always()
      shell: bash
      run: |
        echo "Screenshots: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
