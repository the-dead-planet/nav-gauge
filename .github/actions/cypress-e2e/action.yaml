name: Cypress E2E
description: Set up cached dependencies and run web E2E tests locally or against a deployed site.
inputs:
  build:
    description: Optional command to build the app before testing.
    required: false
  start:
    description: Optional command to start a local server before testing.
    required: false
  base-url:
    description: URL to wait for and test.
    default: http://localhost:3000
  browser:
    description: Browser used to run Cypress tests.
    default: chrome
runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: yarn

    - name: Restore Cypress binary cache
      id: cache-cypress
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: cypress-binary-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    - name: Install Cypress binary
      if: steps.cache-cypress.outputs.cache-hit != 'true'
      shell: bash
      working-directory: app-web
      run: yarn exec cypress install

    - name: Cypress E2E tests
      uses: cypress-io/github-action@v7
      with:
        working-directory: app-web
        install: false
        build: ${{ inputs.build }}
        start: ${{ inputs.start }}
        wait-on: ${{ inputs.base-url }}
        config: baseUrl=${{ inputs.base-url }}
        browser: ${{ inputs.browser }}
