name: Setup Yarn dependencies
description: Set up Node and cached Yarn dependencies; browser binaries are installed separately by E2E jobs.
runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: yarn

    - name: Install dependencies
      shell: bash
      env:
        CYPRESS_INSTALL_BINARY: '0'
      run: yarn install --immutable
