name: Cleanup container images

on:
  schedule:
    - cron: "18 6 * * 0"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - nav-gauge
          - nav-gauge-storybook

    steps:
      - name: Delete old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: the-dead-planet
          REPO: nav-gauge
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail

          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          echo "Cleaning up package: $PACKAGE"
          echo "Cutoff date: $CUTOFF"

          # Determine whether the package is organization- or
          # repository-scoped. Only fall back when the endpoint
          # returns a genuine not-found response.
          get_status() {
            gh api --include "$1" 2>&1 \
              | head -n 1 \
              | awk '{print $2}' || true
          }

          ORG_ENDPOINT="/orgs/$OWNER/packages/container/$PACKAGE/versions"
          REPO_ENDPOINT="/repos/$OWNER/$REPO/packages/container/$PACKAGE/versions"

          STATUS=$(get_status "$ORG_ENDPOINT?per_page=1")

          if [[ "$STATUS" == "200" ]]; then
            ENDPOINT="$ORG_ENDPOINT"
          elif [[ "$STATUS" == "404" ]]; then
            STATUS=$(get_status "$REPO_ENDPOINT?per_page=1")

            if [[ "$STATUS" == "200" ]]; then
              ENDPOINT="$REPO_ENDPOINT"
            elif [[ "$STATUS" == "404" ]]; then
              echo "::error::Package $PACKAGE was not found via either API endpoint."
              exit 1
            else
              echo "::error::Unable to access repository package $PACKAGE (HTTP $STATUS)."
              exit 1
            fi
          else
            echo "::error::Unable to access organization package $PACKAGE (HTTP $STATUS)."
            exit 1
          fi

          echo "Using endpoint: $ENDPOINT"

          gh api --paginate "$ENDPOINT?per_page=100" \
            | jq -s -r --arg cutoff "$CUTOFF" '
                add
                | sort_by(.created_at)
                | reverse
                | .[3:]
                | .[]
                | select(
                    .created_at < $cutoff
                    and ((.metadata.container.tags // []) | index("latest") | not)
                  )
                | .id
              ' \
            | while read -r id; do
                [[ -n "$id" ]] || continue

                echo "Deleting $PACKAGE version $id"
                gh api -X DELETE "$ENDPOINT/$id"
              done

          echo "Cleanup completed for $PACKAGE"
