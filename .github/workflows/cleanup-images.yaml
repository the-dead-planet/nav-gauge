name: Cleanup container images

on:
  schedule:
    - cron: "18 6 * * 0"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - nav-gauge
          - nav-gauge-storybook
    steps:
      - name: Delete old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: the-dead-planet
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          gh api --paginate "/orgs/$OWNER/packages/container/$PACKAGE/versions?per_page=100" \
            | jq -s -r "add | sort_by(.created_at) | reverse | .[3:] | .[]
                        | select(.created_at < \"$CUTOFF\"
                            and ((.metadata.container.tags // []) | index(\"latest\") | not))
                        | .id" \
            | while read -r id; do
                echo "Deleting $PACKAGE version $id"
                gh api -X DELETE "/orgs/$OWNER/packages/container/$PACKAGE/versions/$id"
              done
