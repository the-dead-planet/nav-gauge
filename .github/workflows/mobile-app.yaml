name: Mobile app typecheck

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  typecheck-mobile:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-typecheck-mobile-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-yarn

      - name: Typecheck app-mobile
        run: yarn tsc --noEmit -p app-mobile

      - name: Typecheck gear mobile packages
        run: |
          for dir in gears/*/mobile; do
            if [ -d "$dir" ]; then
              echo "Typechecking $dir..."
              yarn exec tsc --noEmit -p "$dir"
            fi
          done
        shell: bash
