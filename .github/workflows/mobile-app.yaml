name: Mobile app typecheck

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  typecheck-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck app-mobile
        run: yarn tsc --noEmit -p app-mobile

      - name: Typecheck gear mobile packages
        run: |
          for dir in gears/*/mobile; do
            if [ -d "$dir" ]; then
              echo "Typechecking $dir..."
              npx tsc --noEmit -p "$dir"
            fi
          done
        shell: bash
