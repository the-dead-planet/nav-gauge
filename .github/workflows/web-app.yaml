name: Web app test build deploy

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
env:
  IMAGE_NAME: nav-gauge
  STORYBOOK_IMAGE_NAME: nav-gauge-storybook
  IMAGE_REGISTRY: ghcr.io/the-dead-planet
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-yarn

      - name: Typecheck sources and both Cypress suites
        run: yarn typecheck:web

      - name: Run unit tests
        run: yarn test:web

  test-e2e:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-test-e2e-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cypress E2E tests
        uses: ./.github/actions/cypress-e2e
        with:
          build: yarn build
          start: yarn preview

  test-e2e-ui:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    concurrency:
      group: ${{ github.workflow }}-test-e2e-ui-${{ matrix.browser }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cypress UI tests
        uses: ./.github/actions/cypress-e2e
        with:
          working-directory: ui/web
          build: yarn build-storybook
          start: yarn preview
          base-url: http://localhost:6006
          browser: ${{ matrix.browser }}
          artifact-name: cypress-ui-${{ matrix.browser }}

  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      image-reference: ${{ steps.image.outputs.image-reference }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build and publish image
        id: image
        uses: ./.github/actions/build-image
        with:
          dockerfile: app-web/Dockerfile
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          cache-scope: web-app
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build-and-push, test, test-e2e, test-e2e-ui]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        uses: ./.github/actions/deploy-image
        with:
          image: ${{ needs.build-and-push.outputs.image-reference }}
          port: '8084'
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

  storybook-build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      image-reference: ${{ steps.image.outputs.image-reference }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build and publish image
        id: image
        uses: ./.github/actions/build-image
        with:
          dockerfile: ui/web/Dockerfile
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.STORYBOOK_IMAGE_NAME }}
          cache-scope: storybook
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  storybook-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [storybook-build-and-push, test, test-e2e, test-e2e-ui]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        uses: ./.github/actions/deploy-image
        with:
          image: ${{ needs.storybook-build-and-push.outputs.image-reference }}
          port: '8086'
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

  test-e2e-prod:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cypress E2E tests (production)
        uses: ./.github/actions/cypress-e2e
        with:
          browser: chrome
          base-url: https://gauge.spookydoodle.com
          artifact-name: cypress-screenshots-prod
