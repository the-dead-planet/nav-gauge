name: Web app test build deploy

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
env:
  IMAGE_NAME: nav-gauge
  STORYBOOK_IMAGE_NAME: nav-gauge-storybook
  IMAGE_REGISTRY: ghcr.io/the-dead-planet
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate Yarn from packageManager field
        run: corepack prepare yarn@4.14.1 --activate

      - name: Check Yarn version
        run: yarn -v

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: apps

      - name: Run tests
        run: yarn test:web
        working-directory: apps

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate Yarn from packageManager field
        run: corepack prepare yarn@4.14.1 --activate

      - name: Check Yarn version
        run: yarn -v

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: apps

      - name: Lint sources
        run: npx eslint . --no-warn-ignored --max-warnings 0
        working-directory: apps

  test-e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - run: corepack enable

      - name: Setup Node + Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: apps/yarn.lock

      - name: Restore Cypress binary cache
        id: cache-cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('apps/yarn.lock') }}

      - name: Install Cypress binary
        if: steps.cache-cypress.outputs.cache-hit != 'true'
        run: npx --yes cypress@15.15.0 install

      - name: Cypress E2E tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: apps/app-web
          install-command: yarn install --immutable
          build: yarn build
          start: yarn start
          wait-on: 'http://localhost:3000'

  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build . --file apps/app-web/Dockerfile --tag $IMAGE_NAME --label "runnumber=${GITHUB_RUN_ID}"

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
      - name: Push image
        run: |
          IMAGE_ID=$IMAGE_REGISTRY/$IMAGE_NAME
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          [ "$VERSION" == "main" ] && VERSION=latest
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
  
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            IMAGE="ghcr.io/the-dead-planet/nav-gauge"
            PORT="8084"
            PORTS="-p $PORT:8080"

            echo "Pulling new image $IMAGE..."
            docker pull $IMAGE:latest

            CONTAINER_ID=$(docker ps --filter "publish=$PORT" --format "{{.ID}}")
            echo "Current container $CONTAINER_ID"

            if [ -n "$CONTAINER_ID" ]; then
              echo "Stopping container..."
              docker stop $CONTAINER_ID
            fi

            echo "Starting new container..."
            docker run -d --restart=always $PORTS $IMAGE

            if [ -n "$CONTAINER_ID" ]; then
              echo "Removing previous container..."
              docker rm $CONTAINER_ID
            fi
            
            echo "Pruning images..."
            docker image prune -f

  storybook-build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build . --file apps/ui/web/Dockerfile --tag $STORYBOOK_IMAGE_NAME --label "runnumber=${GITHUB_RUN_ID}"

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
      - name: Push image
        run: |
          IMAGE_ID=$IMAGE_REGISTRY/$STORYBOOK_IMAGE_NAME
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          [ "$VERSION" == "main" ] && VERSION=latest
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag $STORYBOOK_IMAGE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
  
  storybook-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    needs: storybook-build-and-push
    permissions:
      contents: read
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            IMAGE="ghcr.io/the-dead-planet/nav-gauge-storybook"
            PORT="8086"
            PORTS="-p $PORT:8080"

            echo "Pulling new image $IMAGE..."
            docker pull $IMAGE:latest

            CONTAINER_ID=$(docker ps --filter "publish=$PORT" --format "{{.ID}}")
            echo "Current container $CONTAINER_ID"

            if [ -n "$CONTAINER_ID" ]; then
              echo "Stopping container..."
              docker stop $CONTAINER_ID
            fi

            echo "Starting new container..."
            docker run -d --restart=always $PORTS $IMAGE

            if [ -n "$CONTAINER_ID" ]; then
              echo "Removing previous container..."
              docker rm $CONTAINER_ID
            fi
            
            echo "Pruning images..."
            docker image prune -f
 
  test-e2e-prod:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack + Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.14.1 --activate
          yarn -v

      - name: Restore Cypress binary cache
        id: cache-cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('apps/yarn.lock') }}

      - name: Install Cypress binary
        if: steps.cache-cypress.outputs.cache-hit != 'true'
        run: npx --yes cypress@15.15.0 install

      - name: Cypress E2E tests (production)
        uses: cypress-io/github-action@v7
        with:
          working-directory: apps/app-web
          install-command: yarn install --immutable
          build: yarn build
          config: baseUrl=https://gauge.spookydoodle.com
        working-directory: apps/app-web